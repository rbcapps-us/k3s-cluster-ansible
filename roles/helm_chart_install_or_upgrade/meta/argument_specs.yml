argument_specs:
  main:
    short_description: "Install or upgrade a package using its Helm chart"
    description: |
      This role must run with become: true, and become_user set to a user which can run kubectl commands.
      The user under which the commands will be executed must be determined by the playbook or role that includes this role.
      Since become_user is not valid with ansible.builtin.include_role, you'll need to wrap ansible.builtin.include_role
      with an outer block which sets become_user.
      Typically, this would look like (assuming you have already run the init role, or explicitly set superuser_name in
      your playbook):
        - name: "Install or upgrade <package-name>"
          become: true
          become_user: "{{ kube_api_user }}"
          block:
            - name: "Install or upgrade <package-name> via the <package-name> Helm chart"
              ansible.builtin.include_role:
                name: helm_chart_install_or_upgrade
              vars:
                ...

      This role sets the following variables on the host:
        - helm_chart_install_or_upgrade_result: A registred result from ansible.builtin.shell for the commands which were executed.
    options:
      helm_namespace:
        description: 'The Kubernetes namespace into which the application will be installed'
        type: str
        required: true
      helm_release_name:
        description: 'The release name under which the application will be installed'
        type: str
        required: true
      helm_repo_name:
        description: 'The repository name for the Helm chart.  This is only used if helm_chart_url is not an OCI URL.'
        type: str
        required: true
      helm_chart_name:
        description: 'The chart name for the Helm chart, under the specified Helm repository'
        type: str
        required: true
      helm_chart_url:
        description: 'The URL for the Helm chart'
        type: str
        required: true
      helm_chart_version:
        description: 'The version of the Helm chart to install or upgrade to'
        type: str
        required: true
      helm_args:
        description: 'Command-line arguments to pass to Helm'
        type: list
        elements: str
        required: true
      helm_omit_namespace_argument_from_kubectl_diff:
        description: |
            Whether to omit the --namespace argument from the kubectl diff command when comparing the Helm-generated template with
            the live cluster.
            Optional.  Defaults to false.
        type: bool
        required: false
      helm_diff_kustomize_patches_yaml:
        description: |
            The patches: section of a kustomization.yaml file to apply to the Helm-generated template before performing the
            kubectl diff.  This must be a valid YAML snippet containing only list items under the patches: key.
            Note that Kustomize is preferred over YQ, because YQ can do unexpected things, including changing the base for octal
            integers from octal to decimal without performing the actual mathematical conversion.
            Optional.  Defaults to an empty string.
        type: str
        required: false
      helm_diff_yq_filter_expressions:
        description: |
            YQ expressions to select which resource(s) from the Helm-generated template will be included in the kubectl diff when
            determining whether the Helm chart needs to be upgraded.
            Optional.  Defaults to an empty list.
        type: list
        elements: str
        required: false
