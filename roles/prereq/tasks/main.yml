#################################
# INSTALL PREREQUISITE PACKAGES #
#################################

- name: "Required package installation and conflicting package removal"
  become: true
  become_user: "{{ superuser_name }}"
  block:
    - name: "Install required packages"
      ansible.builtin.package:
        name:
          - acl
          - curl
          - jq
          - wireguard
        state: present
        update_cache: true

    - name: "Remove the multipath-tools package, because it interferes with Longhorn filesystem creation"
      when: install_longhorn
      ansible.builtin.package:
        name:
          - multipath-tools
        state: absent
        update_cache: true

    - name: "Kill any running multipath processes"
      when: install_longhorn
      ansible.builtin.command: "pkill -9 multipath"
      changed_when: false
      failed_when: false

    - name: "Install python3 and pip using the generic package manager"
      ansible.builtin.package:
        name: |
          {{
            ['python', 'python-pip'] if ansible_facts['os_family'] == 'Archlinux'
            else ['python3', 'python3-pip']
          }}
        state: present

    - name: "Install required pip modules"
      ansible.builtin.pip:
        name:
          - yq
        state: present
      environment:
        PIP_BREAK_SYSTEM_PACKAGES: "1"

#################################################################
# CREATE THE GROUP AND USER WHICH CAN ACCESS THE KUBERNETES API #
#################################################################

- name: 'Create the {{ kube_api_group }} group{{ (" with gid " + (kube_api_group_id | string)) if kube_api_group_id is not none else "" }} if this is a server node'
  when: 'node_k3s_role == "server"'
  become: true
  ansible.builtin.group:
    name: '{{ kube_api_group }}'
    gid: '{{ kube_api_group_id }}'
    state: present

- name: 'Create the {{ kube_api_user }} user{{ (" with uid " + (kube_api_user_id | string)) if kube_api_user_id is not none else "" }} if this is a server node, and the option to create the ks user is enabled'
  when: 'node_k3s_role == "server"'
  become: true
  ansible.builtin.user:
    name: '{{ kube_api_user }}'
    uid: '{{ kube_api_user_id }}'
    group: '{{ kube_api_group }}'
    shell: '/bin/bash'
    system: true
    home: '{{ kube_api_user_home }}'
    create_home: true
    state: present
