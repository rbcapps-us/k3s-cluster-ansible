# TODO: Find a way to check whether Multus-CNI is already installed, and the correct version and configuration, before attempting installation.
- name: "Install Multus-CNI"
  become: true
  become_user: "{{ superuser_name }}"
  block:
    - name: "Get info for the {{ k3s_data_current_symlink }} symlink"
      ansible.builtin.stat:
        path: "{{ k3s_data_current_symlink }}"
      register: multus_cni_stat_result_k3s_data_current_symlink

    - name: "Set multus_cni_cni_plugins_bin_dir based on the current k3s data symlink"
      ansible.builtin.set_fact:
        multus_cni_cni_plugins_bin_dir: "{{ multus_cni_stat_result_k3s_data_current_symlink.stat.lnk_target + '/bin' }}"

    - name: "Create a temporary directory for the Multus-CNI download and extraction"
      ansible.builtin.tempfile:
        state: directory
        prefix: "multus-cni"
      register: multus_cni_tempdir
      changed_when: false

    - name: "Download, extract and install Multus-CNI"
      block:
        - name: "Download Multus-CNI archive"
          ansible.builtin.get_url:
            url: '{{ multus_cni_download_url }}'
            dest: "{{ multus_cni_tempdir.path }}/multus-cni.tar.gz"
            mode: '0644'
          changed_when: false

        - name: "Extract Multus-CNI"
          ansible.builtin.unarchive:
            src: "{{ multus_cni_tempdir.path }}/multus-cni.tar.gz"
            dest: "{{ multus_cni_tempdir.path }}"
            remote_src: true
          changed_when: false

        - name: "Template the Multus-CNI kustomization.yaml.j2 manifest"
          ansible.builtin.template:
            src: "kustomization.yaml.j2"
            dest: "{{ multus_cni_tempdir.path }}/kustomization.yaml"
            mode: '0644'
          changed_when: false

        - name: "Apply the Multus-CNI kustomization.yaml manifest"
          run_once: true
          ansible.builtin.include_role:
            name: kubectl_apply
          vars:
            kubectl_apply_manifest_description: "Multus-CNI kustomization.yaml manifest"
            kubectl_apply_manifest_path: "{{ multus_cni_tempdir.path }}"
            kubectl_apply_manifest_yaml_text: ""
            kubectl_apply_use_kustomize: true
            kubectl_apply_namespace: ""

        - name: "Create the symlink for the multus CNI plugin in {{ cni_plugins_cni_dir }}"
          ansible.builtin.file:
            src: "{{ multus_cni_cni_plugins_bin_dir }}/multus"
            dest: "{{ cni_plugins_cni_dir }}/multus"
            state: link
            force: true
            follow: false

      always:
        - name: "Remove the temporary directory for the Multus-CNI download and extraction"
          ansible.builtin.file:
            path: "{{ multus_cni_tempdir.path }}"
            state: absent
          changed_when: false
