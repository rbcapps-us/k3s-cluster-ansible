- name: "Create a Headlamp token"
  run_once: true
  become: true
  become_user: "{{ kube_api_user }}"
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail

      kubectl -n kube-system create token headlamp-admin --duration=12h
  args:
    executable: /bin/bash
  register: headlamp_token_result_headlamp_token
  changed_when: false

- name: "Display the Headlamp token"
  run_once: true
  ansible.builtin.debug:
    msg: "Headlamp token: {{ headlamp_token_result_headlamp_token.stdout }} "
