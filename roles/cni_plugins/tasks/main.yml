- name: "Install the CNI plugins"
  become: true
  block:
    - name: "Get info for the {{ k3s_data_current_symlink }} symlink"
      ansible.builtin.stat:
        path: "{{ k3s_data_current_symlink }}"
      register: cni_plugins_stat_result_k3s_data_current_symlink

    - name: "Set cni_plugins_bin_dir based on the current k3s data symlink"
      ansible.builtin.set_fact:
        cni_plugins_bin_dir: "{{ cni_plugins_stat_result_k3s_data_current_symlink.stat.lnk_target + '/bin' }}"

    - name: "Check for installed CNI plugins; check each plugin's version"
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail

          cni_plugins_bin_dir={{ cni_plugins_bin_dir | quote }}
          cni_plugins_needed_plugins=()
          {% for plugin in cni_plugins_needed_plugins %}
          cni_plugins_needed_plugins+=({{ plugin | quote }})
          {% endfor %}

          for plugin in "${cni_plugins_needed_plugins[@]}"; do
              plugin_path="${cni_plugins_bin_dir}/${plugin}"
              if [ ! -x "$plugin_path" ]; then
                  echo "Not found: $plugin" >&2
                  echo "NEED_INSTALL"
                  break
              fi
              installed_version=$("$plugin_path" 2>&1 | grep "CNI $plugin plugin" | cut -f4 -d" ")
              if [ "$installed_version" != {{ cni_plugins_version | quote }} ]; then
                  echo "Version mismatch: $plugin" >&2
                  echo "NEED_INSTALL"
                  break
              fi
          done
      args:
        executable: /bin/bash
      register: cni_plugins_result_check_installed_cni_plugins
      failed_when: false
      changed_when: false

    - name: "Install or re-install the CNI plugins"
      when: 'cni_plugins_result_check_installed_cni_plugins.rc != 0 or (cni_plugins_result_check_installed_cni_plugins.stdout | trim) == "NEED_INSTALL"'
      block:
        - name: "Create a temporary directory for the CNI plugins download and extraction"
          ansible.builtin.tempfile:
            state: directory
            prefix: "cni-plugins"
          register: cni_plugins_tempdir
          changed_when: false

        - name: "Download, extract and install the CNI plugins"
          block:
            - name: "Download the CNI plugins archive"
              ansible.builtin.get_url:
                url: '{{ cni_plugins_download_url }}'
                dest: "{{ cni_plugins_tempdir.path }}/cni-plugins-linux.tgz"
                mode: '0644'
              changed_when: false

            - name: "Extract the CNI plugins"
              ansible.builtin.unarchive:
                src: "{{ cni_plugins_tempdir.path }}/cni-plugins-linux.tgz"
                dest: "{{ cni_plugins_tempdir.path }}"
                remote_src: true
              changed_when: false

            - name: "Move the CNI plugins into place"
              ansible.builtin.command:
                cmd: 'mv -f {{ (cni_plugins_tempdir.path + "/" + item) | quote }} {{ (cni_plugins_bin_dir + "/" + item) | quote }}'
              loop: "{{ cni_plugins_needed_plugins }}"
              changed_when: true

            - name: "Ensure that {{ cni_plugins_cni_dir }} directory exists"
              ansible.builtin.file:
                path: "{{ cni_plugins_cni_dir }}"
                state: directory
                mode: '0755'

            - name: "Create the symlinks for the CNI plugins in {{ cni_plugins_cni_dir }}"
              ansible.builtin.file:
                src: "{{ cni_plugins_bin_dir }}/{{ item }}"
                dest: "{{ cni_plugins_cni_dir }}/{{ item }}"
                state: link
              loop: "{{ cni_plugins_needed_plugins }}"

          always:
            - name: "Remove the temporary directory for the CNI plugins"
              ansible.builtin.file:
                path: "{{ cni_plugins_tempdir.path }}"
                state: absent
              changed_when: false
