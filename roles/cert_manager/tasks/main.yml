- name: "Run Cert-Manager installation tasks"
  run_once: true
  become: true
  become_user: "{{ kube_api_user }}"
  block:
    - name: "Install or upgrade Cert-Manager via the Cert-Manager Helm chart"
      ansible.builtin.include_role:
        name: helm_chart_install_or_upgrade
      vars:
        helm_namespace: "cert-manager"
        helm_release_name: "cert-manager"
        helm_repo_name: ""
        helm_chart_name: "cert-manager"
        helm_chart_url: "{{ cert_manager_helm_chart_url }}"
        helm_chart_version: "{{ cert_manager_helm_chart_version }}"
        helm_args: "{{ cert_manager_helm_base_args + cert_manager_helm_extra_args }}"
        helm_omit_namespace_argument_from_kubectl_diff: true
        helm_diff_kustomize_patches_yaml: ""
        helm_diff_yq_filter_expressions:
          - 'select((.kind == "Job" and .metadata.name == "cert-manager-startupapicheck") | not)'
          - 'select((.kind == "Role" and .metadata.name == "cert-manager-startupapicheck:create-cert") | not)'
          - 'select((.kind == "RoleBinding" and .metadata.name == "cert-manager-startupapicheck:create-cert") | not)'
          - 'select((.kind == "ServiceAccount" and .metadata.name == "cert-manager-startupapicheck") | not)'

    - name: "Create Cluster-Local CA secrets and optional ClusterIssuer"
      # If we have a CA certificate, we have to run these tasks.
      # We will only template the CA private key / certificate secret and cert-manager ClusterIssuer
      # We will only template the CA private key / certificate secret and cert-manager ClusterIssuer
      # if we also have cert_manager_cluster_local_ca_private_key.
      # This logic is handled in the template.
      when: 'cert_manager_cluster_local_ca_cert != ""'
      block:

        - name: "Create a temporary directory for the cert-manager local CA resources"
          ansible.builtin.tempfile:
            state: directory
            prefix: "cert-manager-local-ca-resources"
          register: cert_manager_local_ca_resources_tempdir
          changed_when: false

        - name: "Template and apply the cert-manager local CA resources manifest; remove the temporary directory"
          block:
            - name: "Template the cert-manager local CA resources manifest"
              ansible.builtin.template:
                src: "cert-manager-local-ca-resources.yaml.j2"
                dest: "{{ cert_manager_local_ca_resources_tempdir.path }}/cert-manager-local-ca-resources.yaml"
                mode: '0644'
              changed_when: false

            - name: "Apply the cert-manager local CA resources manifest"
              become: true
              ansible.builtin.shell:
                cmd: |
                  set -euo pipefail

                  set +e
                  kubectl diff -f {{ cert_manager_local_ca_resources_tempdir.path | quote }}/cert-manager-local-ca-resources.yaml
                  kubectl_diff_retval="$?"
                  set -e

                  if [ "$kubectl_diff_retval" -ne 0 ]; then
                      # Exit code 1 from kubectl diff indicates differences were found.
                      # Any other non-zero exit code indicates an unexpected error.
                      if [ "$kubectl_diff_retval" -ne 1 ]; then
                          echo "kubectl diff failed with unexpected return code $kubectl_diff_retval" >&2
                          exit "$kubectl_diff_retval"
                      fi
                      kubectl apply -f {{ cert_manager_local_ca_resources_tempdir.path | quote }}/cert-manager-local-ca-resources.yaml
                      exit 99
                  fi
              args:
                executable: /bin/bash
              register: cert_manager_local_ca_resources_apply_result
              changed_when: "cert_manager_local_ca_resources_apply_result.rc == 99"
              failed_when: "cert_manager_local_ca_resources_apply_result.rc not in [0, 99]"

          always:
            - name: "Remove the temporary directory for the cert-manager local CA resources manifest"
              ansible.builtin.file:
                path: "{{ cert_manager_local_ca_resources_tempdir.path }}"
                state: absent
              changed_when: false
