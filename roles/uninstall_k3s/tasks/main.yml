- name: "Uninstall k3s"
  become: true
  block:
    - name: "Uninstall k3s server or agent, if installed"
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail

          retval=0
          if [ -x /usr/local/bin/k3s-uninstall.sh ]; then
              /usr/local/bin/k3s-uninstall.sh
              retval=99
          fi
          if [ -x /usr/local/bin/k3s-agent-uninstall.sh ]; then
              /usr/local/bin/k3s-agent-uninstall.sh
              retval=99
          fi
          exit "$retval"
      args:
        executable: /bin/bash
      register: uninstall_k3s_result_k3s_server_agent_uninstall
      changed_when: 'uninstall_k3s_result_k3s_server_agent_uninstall.rc == 99'
      failed_when: 'uninstall_k3s_result_k3s_server_agent_uninstall.rc not in [0, 99]'

    - name: "Set uninstall_k3s_dirs_and_files_to_remove fact"
      ansible.builtin.set_fact:
        uninstall_k3s_dirs_and_files_to_remove:
          - /etc/rancher/k3s
          - /etc/rancher/node
          - /var/lib/rancher/k3s
          - /var/lib/kubelet
          - /usr/local/bin/k3s
          - /usr/local/bin/k3s-install.sh
          - /usr/local/bin/helm
          - /opt/cni
          - /etc/cni
          - /dev/longhorn
          - /var/lib/longhorn
          - '{{ superuser_home }}/.kube'

    - name: "Append directories under {{ k3s_storage_dir }} to uninstall_k3s_dirs_and_files_to_remove fact"
      when: 'k3s_storage_dir != ""'
      ansible.builtin.set_fact:
        uninstall_k3s_dirs_and_files_to_remove: |
          {{
              uninstall_k3s_dirs_and_files_to_remove + [
                  k3s_storage_dir + "/k3s",
                  k3s_storage_dir + "/longhorn",
              ]
          }}

    - name: "Remove residual files and directories"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: '{{ uninstall_k3s_dirs_and_files_to_remove }}'

    - name: "Remove the {{ kube_api_user_home }}.kube directory"
      ansible.builtin.file:
        path: "{{ kube_api_user_home }}/.kube"
        state: absent

    - name: "Attempt to remove empty directories"
      ansible.builtin.shell:
        cmd: |
          set -uo pipefail
          set +e

          rmdir {{ item | quote }} && exit 99
          exit 0
      args:
        executable: /bin/bash
      register: uninstall_k3s_result_rmdir
      changed_when: 'uninstall_k3s_result_rmdir.rc == 99'
      failed_when: 'uninstall_k3s_result_rmdir.rc not in [0, 99]'
      loop:
        - /etc/rancher
        - /var/lib/rancher
