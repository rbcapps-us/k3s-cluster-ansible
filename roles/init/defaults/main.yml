superuser_name: ""

k3s_hosts_group: "k3s_nodes"
k3s_storage_dir: ""

kube_api_user: k3s
kube_api_user_id: null
kube_api_user_home: "/home/{{ kube_api_user }}"

kube_api_group: k3s
kube_api_group_id: null

num_k3s_server_nodes: '{{ 3 if (groups[k3s_hosts_group] | length) >= 3 else 1 }}'

install_headlamp: true

install_longhorn: true

install_cni_plugins: false

install_multus_cni: false

install_whereabouts_ipam_plugin: true

install_emberstack_kubernetes_secrets_reflector: true

install_stakater_reloader: true

install_cert_manager: true

install_keepalived_cluster_load_balancer: true

cluster_load_balancer_services: []
  # Typical setting for HTTP and HTTPS services.
  # Be sure to replace the ip_address with the real IP address which on which you will expose the HTTP and HTTPS services.
  # - vrrp_instance_name: http_https
  #   network_interface: eth0
  #   virtual_router_id: 51
  #   ip_address: 1.2.3.4
  #   ports:
  #     - port_number: 80
  #       health_check_protocol: http
  #       health_check_path: /
  #       health_check_healthy_status_codes: 200-299,404
  #     - port_number: 443
  #       health_check_protocol: https
  #       health_check_path: /
  #       health_check_healthy_status_codes: 200-299,404
  # Typical settings for TCP services (this example is for CloudNativePG [PostgreSQL] on port 5432):
  # - vrrp_instance_name: cnpg1
  #   network_interface: eth0
  #   virtual_router_id: 53
  #   ip_address: 1.2.3.5
  #   ports:
  #     - port_number: 5432
  #       health_check_protocol: tcp
