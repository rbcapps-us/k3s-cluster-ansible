- name: "Assert that num_k3s_server_nodes is odd, and less than or equal to the number of k3s nodes"
  run_once: true
  ansible.builtin.assert:
    that: 'num_k3s_server_nodes is odd and num_k3s_server_nodes > 0 and num_k3s_server_nodes <= (groups[k3s_hosts_group] | length)'

- name: "Assert that install_cni_plugins is true if any of the optional components which require the CNI plugins are enabled"
  when: 'install_multus_cni'
  run_once: true
  ansible.builtin.assert:
    that: install_cni_plugins

- name: "Get the superuser information when superuser_name is set to a non-empty value"
  when: 'superuser_name != ""'
  block:
    - name: "Get the group name and home directory of the superuser"
      become: true
      become_user: '{{ superuser_name }}'
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail

          id -gn
          echo $HOME
      args:
        executable: /bin/bash
      register: init_result_superuser_info
      changed_when: false
    - name: "Set superuser information as facts"
      ansible.builtin.set_fact:
        superuser_group: '{{ superuser_group | default(init_result_superuser_info.stdout_lines[0] | trim, true) }}'
        superuser_home: '{{ superuser_home | default(init_result_superuser_info.stdout_lines[1] | trim, true) }}'

- name: "Get the superuser information when superuser_name is set to empty"
  when: 'superuser_name == ""'
  block:
    - name: "Get the username, group name, and home directory of the superuser"
      become: true
      # No become_user specified; use the configured default, or fall back to root if none is configured
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail

          id -un
          id -gn
          echo $HOME
      args:
        executable: /bin/bash
      register: init_result_superuser_info
      changed_when: false
    - name: "Set superuser information as facts"
      ansible.builtin.set_fact:
        superuser_name: '{{ superuser_name | default(init_result_superuser_info.stdout_lines[0] | trim, true) }}'
        superuser_group: '{{ superuser_group | default(init_result_superuser_info.stdout_lines[1] | trim, true) }}'
        superuser_home: '{{ superuser_home | default(init_result_superuser_info.stdout_lines[2] | trim, true) }}'
