argument_specs:
  main:
    short_description: "Install or upgrade Longhorn block storage"
    options:
      longhorn_helm_chart_version:
        description: 'The Longhorn Helm chart version to install'
        type: str
      longhorn_default_volume_replica_count:
        description: |
          The default number of replicas for Longhorn volumes.
          By default, this is automatically calculated based on the number of nodes in the cluster.
        type: int
      longhorn_helm_base_args:
        description: 'List of base arguments to pass to Helm when installing the Longhorn Helm chart'
        type: list
        elements: str
      longhorn_helm_storage_dir_args:
        description: |
          Arguments to pass to Helm for configuring the Longhorn storage directory when k3s_storage_dir is not empty.
          By default, this is calculated based on the k3s_storage_dir variable.
          Normally, you would only override this value if you need to provide a custom storage directory configuration
          for Longhorn volumes and metadata.
        type: list
        elements: str
      longhorn_ingress_enabled:
        description: 'Whether to enable the Longhorn ingress'
        type: bool
      longhorn_ingress_path:
        description: 'Longhorn ingress URI path'
        type: path
      longhorn_ingress_path_type:
        description: 'Longhorn ingress path type'
        type: str
      longhorn_ingress_middlewares:
        description: 'List of Longhorn ingress middlwares to be annotated on the Longhorn ingress'
        type: list
        elements: str
      longhorn_ingress_extra_annotations:
        description: 'Dictionary of extra annotations for the Longhorn ingress'
        type: dict
      longhorn_ingress_annotations_combined:
        description: |
          Dictionary of annotations for the Longhorn ingress.
          By default, this is generated by combining annotations for longhorn_ingress_middlewares with
          any extra annotations specified in longhorn_ingress_extra_annotations.
          Normally, you would only override this value if you need to provide custom annotations which
          are not covered by the default combination of middlewares and extra annotations.
        type: dict
      longhorn_helm_ingress_args:
        description: |
          List of arguments to pass to Helm for configuring Longhorn ingress.
          By default, this is calculated based on the longhorn_ingress_* variables.
          Normally, you would only override this value if you need to provide a custom ingress configuration
          which is not covered by the default combination of options.
        type: list
        elements: str
      longhorn_helm_extra_args:
        description: 'List of extra arguments to pass to Helm when installing the Longhorn Helm chart'
        type: list
        elements: str
      longhorn_ui_credentials:
        description: |
          List of usernames and passwords for accessing the Longhorn UI.
          Each element in the list must be a dictionary containing a 'username' and 'password' key, each with string values.
        type: list
        elements: dict
        no_log: true
